  <path d="M368 150 V122 a32 32 0 0 1 64 0 V150" fill="none" stroke="#16324f" stroke-width="12"/>
  <circle cx="400" cy="180" r="10" fill="#faf6f0"/>
  <rect x="396" y="180" width="8" height="18" fill="#faf6f0"/>

  <!-- small decorative dots -->
  <circle cx="140" cy="90" r="6" fill="#b08968"/>
  <circle cx="660" cy="80" r="8" fill="#16324f" opacity="0.5"/>
  <circle cx="700" cy="150" r="5" fill="#b08968"/>
</svg>
