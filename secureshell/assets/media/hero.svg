<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Illustration of a laptop with a padlock protecting a login screen">
  <!-- Placeholder illustration: hand-coded shapes, not an AI image generator. Swap for your team's own artwork before submitting. -->
  <rect x="0" y="0" width="800" height="360" fill="#faf6f0"/>

  <!-- laptop base -->
  <rect x="150" y="260" width="500" height="18" rx="4" fill="#16324f"/>
  <path d="M190 260 L215 120 A10 10 0 0 1 225 112 H575 A10 10 0 0 1 585 120 L610 260 Z"
        fill="#ffffff" stroke="#16324f" stroke-width="4"/>

  <!-- screen content: simple login form -->
  <rect x="255" y="140" width="290" height="16" rx="3" fill="#e5e7eb"/>
  <rect x="255" y="170" width="220" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="255" y="200" width="170" height="28" rx="4" fill="#b08968"/>
  <text x="270" y="219" font-family="Georgia, serif" font-size="14" fill="#ffffff">Sign in securely</text>

  <!-- big padlock over the screen -->
